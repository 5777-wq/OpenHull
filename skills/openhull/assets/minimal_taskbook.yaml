# Minimal working task book for OpenHull (agent skill quick check).
# 45,000 t bulk carrier, 16.0 kn — deliberately INSIDE every guard
# band (Ayre V/sqrt(L) and the digitised L/Delta^(1/3) family band),
# so a first run exercises the FULL chain including the propeller.
# Only four fields are REQUIRED; the rest is optional and documented
# in examples/taskbook_bulk_carrier.yaml (full form).
schema_version: 1
taskbook_id: MIN-45000
title: "45,000 t bulk carrier, minimal task book (full-chain probe)"
ship_type: bulk_carrier
requirements:
  deadweight_t: 45000
  service_speed_kn: 16.0
  kg_m: 9.5                     # optional: enables stability + seakeeping
  drafts:
    design_draft_m: 11.6
constraints:
  block_coefficient_design: 0.80
propeller:                      # optional: enables the propeller design
  blades_z: 4
  expanded_area_ratio: 0.55
  rpm: 100
  shaft_immersion_m: 6.0
  shaft_efficiency: 0.98
  relative_rotative_eff: 0.99
