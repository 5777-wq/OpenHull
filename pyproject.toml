[project]
name = "openhull"
version = "1.7.0"
description = "Agent-orchestrated parametric ship preliminary design toolchain"
readme = "README.md"
license = "MIT"
authors = [
    { name = "5777-wq", email = "5777-wq@users.noreply.github.com" }
]
requires-python = ">=3.11"
keywords = ["ship-design", "naval-architecture", "hydrostatics", "hull", "agent"]
dependencies = [
    "ezdxf>=1.4.4",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# task 3.8 stage 2 (owner decision 2026-09-23): the seakeeping BEM
# layer is optional so the core toolchain stays light
seakeeping = ["capytaine>=3.0"]
# v1.7.0: MCP server surface (the agent-native invocation path promised
# by the constitution §8 "agent-facing contract").  Optional for the
# same reason as seakeeping: the core CLI stays light, the MCP SDK is
# imported lazily by openhull.mcp_server only.
mcp = ["mcp>=1.2,<2"]

[project.scripts]
openhull = "openhull.cli:main"
openhull-mcp = "openhull.mcp_server:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# register the optional-extra marker (v1.0.4 fix: mark, don't
# importorskip, so "collected" arithmetic stays exact)
markers = [
    "seakeeping: needs the optional capytaine extra (deselect with -m 'not seakeeping')",
]

[tool.ruff]
# round-9 (2026-09-30): the project's guard/whitelist discipline needed
# a static-check gate to match.  Pragmatic set: real errors and likely
# bugs; line length is not enforced (table data and citation blocks
# carry long lines by design).  Run: `uvx ruff check src tests`
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = [
    "E501",  # long lines: digitised tables and citation tuples
    # B905 (zip without strict=): the numeric chains zip grids whose
    # lengths are fixed by construction; converting 38 sites to
    # strict=True is a behaviour change (silent truncation -> refusal)
    # that the no-numeric-drift discipline does not allow in a lint
    # batch.  Recorded as an open direction.
    "B905",
]

[tool.ruff.lint.per-file-ignores]
# __init__ re-exports names deliberately (public API facade)
"src/openhull/__init__.py" = ["F401"]
