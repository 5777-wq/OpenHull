name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # uv.lock records wheel URLs from the maintainer's local mirror
      # (Tsinghua), which rejects GitHub runners; force the official
      # index on CI
      UV_INDEX_URL: https://pypi.org/simple
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Run tests
        run: uv run pytest -q
